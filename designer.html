<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>صمّم مستودعك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12; --bg2:#0b111b; --panel:#0f1622; --panel2:#131c2b; --line:#1d2839; --line2:#2a3a52;
  --text:#e9eef5; --mute:#8f9cae; --amber:#f0a82a; --teal:#3fd0c4; --red:#e0584a; --green:#4cc38a;
  --font:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.65;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg2)}
.top .back{display:flex;align-items:center;gap:8px;color:var(--mute);font-weight:700;font-size:14px}
.top .back:hover{color:var(--text)}
.phases{display:flex;gap:8px;font-size:13px;font-weight:700}
.phases span{padding:5px 14px;border-radius:999px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.phases span.on{background:var(--amber);border-color:var(--amber);color:#1a1203}
.phases span.done{color:var(--teal);border-color:var(--teal)}
.app{display:grid;grid-template-columns:400px 1fr;height:calc(100dvh - 56px)}
.side>*{flex:none}
.side{background:var(--panel);border-inline-end:1px solid var(--line);overflow-y:auto;padding:20px 18px 28px;display:flex;flex-direction:column;gap:16px}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(900px 500px at 60% 0%,#14233a,#070b12)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
h1{font-size:23px;font-weight:900;line-height:1.3}
h2{font-size:17px;font-weight:800}
.hint{color:var(--mute);font-size:13.5px}
.card{border:1px solid var(--line2);background:var(--panel2);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
label.f{display:block;font-size:13px;color:var(--mute);font-weight:700;margin-bottom:2px}
.sl{display:flex;align-items:center;gap:10px}
.sl input[type=range]{flex:1;accent-color:var(--amber)}
.sl b{font-family:var(--mono);min-width:44px;text-align:left;direction:ltr;color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:800;font-size:15px;border:1px solid transparent;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;color:inherit}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--amber);color:#1a1203}
.btn-p:hover:not(:disabled){background:#ffbc40}
.btn-g{background:var(--panel);border-color:var(--line2)}
.btn-g:hover:not(:disabled){border-color:var(--teal)}
.btn-wa{background:#25d366;color:#04220f}
.btn-s{padding:7px 12px;font-size:13px;border-radius:9px}
.btn-del{background:rgba(224,88,74,.12);border-color:rgba(224,88,74,.4);color:#ff8f82}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:8px;background:var(--panel);border:0;color:var(--mute);font-weight:700;cursor:pointer;font-size:14px}
.seg button.on{background:var(--amber);color:#1a1203}
.seg button.on.cold{background:var(--teal)}
.num{display:flex;align-items:center;gap:8px}
.num button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-size:18px;cursor:pointer}
.num b{min-width:22px;text-align:center;font-family:var(--mono);font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center;background:var(--bg2)}
.stat b{display:block;font-family:var(--mono);font-size:20px;color:var(--amber);direction:ltr}
.stat span{font-size:12px;color:var(--mute)}
.tag{font-family:var(--mono);font-size:12.5px;direction:ltr;display:inline-block;padding:2px 8px;border-radius:6px;background:#05080d;border:1px solid var(--line);color:var(--teal)}
.tag.a{color:var(--amber)}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid transparent;color:var(--mute);font-weight:700;font-size:14px}
.stp i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line2);flex:none}
.stp.on{background:rgba(240,168,42,.1);border-color:rgba(240,168,42,.5);color:var(--text)}
.stp.on i{background:var(--amber);color:#1a1203;border-color:var(--amber)}
.stp.done{color:var(--text)}
.stp.done i{background:var(--teal);color:#04201d;border-color:var(--teal)}
.detail{min-height:120px}
.detail table{width:100%;border-collapse:collapse;font-size:13.5px}
.detail th{color:var(--mute);font-weight:700;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line2);font-size:12.5px}
.detail td{padding:6px;border-bottom:1px dashed var(--line)}
.ln{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13.5px;animation:fi .4s}
.ln .ok{color:var(--green)}.ln .warn{color:var(--amber)}.ln .bad{color:var(--red)}
@keyframes fi{from{opacity:0;transform:translateY(5px)}}
.big{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--amber);direction:ltr;line-height:1.1}
.log{border:1px solid var(--line);background:#05080d;border-radius:10px;padding:8px 10px;font-family:var(--mono);font-size:11.5px;direction:ltr;max-height:130px;overflow-y:auto;color:var(--mute)}
.log div{padding:2px 0}.log b{color:var(--amber)}.log em{font-style:normal;color:var(--teal)}
.inv{width:100%;border-collapse:collapse;font-size:13.5px}
.inv td{padding:7px 4px;border-bottom:1px dashed var(--line)}
.inv td:last-child{text-align:left;font-family:var(--mono);direction:ltr}
.inv input{width:64px;background:#05080d;border:1px solid var(--line2);border-radius:6px;color:var(--amber);font-family:var(--mono);padding:3px 6px;text-align:center}
.inv tr.t td{font-weight:900;font-size:16px;color:var(--amber);border-bottom:0}
.qi{width:100%;margin-top:8px;background:#05080d;border:1px solid var(--line2);border-radius:10px;color:var(--text);font-family:var(--font);font-size:15px;padding:10px 12px}
.qi:focus{outline:2px solid var(--amber);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{background:var(--bg2);border:1px solid var(--line2);color:var(--mute);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chips button:hover{border-color:var(--amber);color:var(--text)}
.res{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.res .it{display:block;width:100%;text-align:right;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);cursor:pointer;font-family:inherit;font-size:13.5px}
.res .it:hover{border-color:var(--amber)}
.res .it small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.hud{position:absolute;inset-inline-start:14px;top:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.hud span{background:rgba(7,11,18,.72);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--mute)}
.toast{position:absolute;bottom:18px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--panel2);border:1px solid var(--amber);color:var(--text);padding:9px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.nogl{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--mute)}
@media(max-width:900px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .stage{order:-1;height:56dvh;flex:none}
  .side{overflow:visible;border-inline-end:0}
  .phases span{padding:4px 9px;font-size:12px}
  .top .back span{display:none}
}
</style>
</head>
<body>
<div class="top">
  <a class="back" id="backLink" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span>الصفحة الرئيسية</span></a>
  <div class="phases"><span id="ph1" class="on">١ صمّم</span><span id="ph2">٢ الرحلة</span><span id="ph3">٣ الفاتورة</span></div>
</div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud"></div>
    <div class="toast" id="toast"></div>
    <div class="nogl" id="nogl">متصفحك ما بدعم العرض ثلاثي الأبعاد (WebGL). جرّب متصفح ثاني أو جهاز آخر.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
var PHONE="962791765232";
/* ---------- constants ---------- */
var SW=1.3, SD=1.1, LH=1.25, AISLE=2.4, Y0=0.1;
var GAP=2.6, WALLM=2.4, FRONTM=4.4;
var $=function(s){return document.querySelector(s)};
var pad2=function(n){return n<10?"0"+n:""+n};
var ease=function(k){return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2};
var SPEED=1;

/* ---------- state ---------- */
var S={W:36,D:30,areas:[],sel:null,mode:"design",nextId:1};
var sceneObjs={}; /* areaId -> group */

/* ---------- three setup ---------- */
var cv=$("#cv");
var renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true}); }catch(e){ $("#nogl").style.display="grid"; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(42,1,.5,600);
var controls=new THREE.OrbitControls(camera,cv);
controls.enableDamping=true; controls.dampingFactor=.08; controls.maxPolarAngle=1.42; controls.minDistance=8; controls.maxDistance=160;
scene.background=new THREE.Color(0x0a111c);
scene.add(new THREE.HemisphereLight(0xcfe3ff,0x1a2230,.95));
var dl=new THREE.DirectionalLight(0xffffff,.75); dl.position.set(18,40,22); scene.add(dl);

var world=new THREE.Group(); scene.add(world);   /* floor + walls */
var areasG=new THREE.Group(); scene.add(areasG);
var propsG=new THREE.Group(); scene.add(propsG); /* journey props */

/* shared geometries / materials */
var gPost=new THREE.BoxGeometry(.08,1,.08), gPallet=new THREE.BoxGeometry(1.05,.1,.9), gBox=new THREE.BoxGeometry(.95,.8,.8);
var mPost=new THREE.MeshLambertMaterial({color:0x3f77b0}), mBeam=new THREE.MeshLambertMaterial({color:0xe9a02a});
var mWood=new THREE.MeshLambertMaterial({color:0x4a3a2a});
var boxColors=[0xb98a55,0xa87f4a,0xc79a62,0x8d6b3f,0x9a7448].map(function(c){return new THREE.MeshLambertMaterial({color:c})});
var mJ=new THREE.MeshLambertMaterial({color:0xf0a82a,emissive:0x5a3a00});
var mJ2=new THREE.MeshLambertMaterial({color:0x3fd0c4,emissive:0x0b3f3a});
var mBad=new THREE.MeshLambertMaterial({color:0xe0584a,emissive:0x5a1510});

function makeLabel(text,color,scale,font){
  var c=document.createElement("canvas"); c.width=256; c.height=96; var x=c.getContext("2d");
  x.font=(font||"800 52px ")+"Cairo, Segoe UI, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
  x.lineWidth=8; x.strokeStyle="rgba(7,11,18,.9)"; x.strokeText(text,128,50); x.fillStyle=color||"#fff"; x.fillText(text,128,50);
  var t=new THREE.CanvasTexture(c); var m=new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false});
  var s=new THREE.Sprite(m); s.scale.set(2.6*(scale||1),.98*(scale||1),1); s.renderOrder=10; return s;
}
function makePallet(opt){
  var g=new THREE.Group();
  var b=new THREE.Mesh(gPallet,mWood); b.position.y=.05; g.add(b);
  var mat=opt&&opt.mat?opt.mat:boxColors[Math.floor(Math.random()*boxColors.length)];
  var bx=new THREE.Mesh(gBox,mat); bx.position.y=.1+.4; g.add(bx);
  g.userData.box=bx;
  return g;
}

/* ---------- floor & walls ---------- */
function disposeGroup(g){ while(g.children.length){var c=g.children.pop(); if(c.geometry&&!c.userData.shared)c.geometry.dispose(); if(c.material&&c.material.map)c.material.map.dispose(); if(c.children&&c.children.length)disposeGroup(c);} }
function buildWorld(){
  disposeGroup(world);
  var W=S.W,D=S.D;
  var fl=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:0x0e1622})); fl.rotation.x=-Math.PI/2; world.add(fl);
  var pts=[]; for(var x=-W/2;x<=W/2+.01;x+=2){pts.push(x,.01,-D/2,x,.01,D/2)} for(var z=-D/2;z<=D/2+.01;z+=2){pts.push(-W/2,.01,z,W/2,.01,z)}
  var gg=new THREE.BufferGeometry(); gg.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));
  world.add(new THREE.LineSegments(gg,new THREE.LineBasicMaterial({color:0x1b2738})));
  var wm=new THREE.MeshBasicMaterial({color:0x4a6a94,transparent:true,opacity:.16,depthWrite:false,side:THREE.DoubleSide});
  var H=3.4, T=.18, DW=5.6;
  function wall(w,d,x,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,H,d),wm); m.position.set(x,H/2,z); world.add(m);
    var e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x6d8fbd})); e.position.copy(m.position); world.add(e);}
  wall(W,T,0,-D/2); wall(T,D,-W/2,0); wall(T,D,W/2,0);
  var sw=(W-DW)/2; wall(sw,T,-(DW/2+sw/2),D/2); wall(sw,T,(DW/2+sw/2),D/2);
  /* door */
  var ds=new THREE.Mesh(new THREE.PlaneGeometry(DW,1.6),new THREE.MeshBasicMaterial({color:0xf0a82a,transparent:true,opacity:.18})); ds.rotation.x=-Math.PI/2; ds.position.set(0,.02,D/2-.8); world.add(ds);
  var dl2=makeLabel("الباب والاستلام","#f0a82a",1.05,"800 40px "); dl2.position.set(0,2.6,D/2+.4); world.add(dl2);
  /* pads & holding */
  var padZ=D/2-.9; S.padZ=padZ; S.zf=padZ-1.45;
  S.pads=[-2.4,-.8,.8,2.4].map(function(x){return {x:x,z:padZ}});
  S.hold=[5,6.8].map(function(x){return {x:x,z:padZ}});
  var lm=new THREE.LineBasicMaterial({color:0xf0a82a});
  S.pads.forEach(function(p){ world.add(padLoop(p,lm)); });
  var lm2=new THREE.LineBasicMaterial({color:0x3fd0c4});
  S.hold.forEach(function(p){ world.add(padLoop(p,lm2)); });
  var hl=makeLabel("منطقة مؤقتة","#3fd0c4",.8,"800 40px "); hl.position.set(5.9,1.6,padZ); world.add(hl);
}
function padLoop(p,mat){ var h=[-.55,-.48,.55,-.48,.55,.48,-.55,.48,-.55,-.48]; var pts=[]; for(var i=0;i<h.length;i+=2)pts.push(new THREE.Vector3(p.x+h[i]*1.0,.03,p.z+h[i+1]));
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat); }

/* ---------- areas ---------- */
function areaDims(a){ a.w=a.pos*SW+.4; a.d=a.rows*(SD+AISLE); }
function rng(seed){ var t=seed>>>0; return function(){ t+=0x6D2B79F5; var r=Math.imul(t^t>>>15,1|t); r^=r+Math.imul(r^r>>>7,61|r); return((r^r>>>14)>>>0)/4294967296; }; }
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function slotPos(a,r,p,l){ return {x:a.x-a.w/2+.2+SW*(p+.5), z:a.z-a.d/2+r*(SD+AISLE)+SD/2, y:Y0+l*LH}; }
function locCode(a,r,p,l){ return "WH01-"+a.id+"-R"+pad2(r+1)+"-P"+pad2(p+1)+"-L"+pad2(l+1); }
var DRY_SUP=[{n:"شركة النخبة للتجارة",m:["زيت طعام 5 لتر","سكر 1 كغ"]},{n:"مؤسسة الأفق",m:["أرز 10 كغ","معكرونة 500 غ"]},{n:"الأمل للمواد الغذائية",m:["معلبات فول","عصير برتقال"]}];
var COLD_SUP=[{n:"ألبان الريف",m:["جبنة مبرّدة","لبنة مبرّدة"]},{n:"مزارع الوادي",m:["حليب طازج","زبدة مبرّدة"]}];
function makeSlots(a){
  var rnd=rng(hashStr(a.id+a.rows+"x"+a.pos+"x"+a.lev+(a.type)));
  var pool=a.type==="cold"?COLD_SUP:DRY_SUP;
  a.slots=[]; for(var r=0;r<a.rows;r++){a.slots[r]=[];for(var p=0;p<a.pos;p++){a.slots[r][p]=[];
    var fill=rnd()<.42?Math.ceil(rnd()*a.lev):0, sp=pool[Math.floor(rnd()*pool.length)];
    for(var l=0;l<a.lev;l++)a.slots[r][p][l]=l<fill?{pre:true,c:Math.floor(rnd()*boxColors.length),sup:sp.n,mat:sp.m[Math.floor(rnd()*sp.m.length)],q:(2+Math.floor(rnd()*10))*10}:null;}}
}
function buildArea(a){
  var old=sceneObjs[a.id]; if(old){areasG.remove(old);disposeGroup(old);}
  var g=new THREE.Group(); g.position.set(a.x,0,a.z); sceneObjs[a.id]=g; areasG.add(g);
  var h=a.lev*LH+.3, rz;
  for(var r=0;r<a.rows;r++){
    rz=-a.d/2+r*(SD+AISLE)+SD/2;
    for(var i=0;i<=a.pos;i++){ var px=-a.w/2+.2+i*SW;
      [-SD/2+.04,SD/2-.04].forEach(function(dz){var m=new THREE.Mesh(gPost,mPost);m.userData.shared=true;m.scale.y=h;m.position.set(px,h/2,rz+dz);g.add(m);}); }
    for(var l=0;l<a.lev;l++){ [-SD/2+.04,SD/2-.04].forEach(function(dz){var m=new THREE.Mesh(new THREE.BoxGeometry(a.pos*SW,.1,.06),mBeam);m.position.set(-a.w/2+.2+a.pos*SW/2,l*LH+.05,rz+dz);g.add(m);}); }
  }
  /* pallets */
  for(var r2=0;r2<a.rows;r2++)for(var p2=0;p2<a.pos;p2++)for(var l2=0;l2<a.lev;l2++){
    var s=a.slots[r2][p2][l2]; if(s&&s.pre){ var pm=makePallet({mat:boxColors[s.c]}); var sp=slotPos(a,r2,p2,l2); pm.position.set(sp.x-a.x,sp.y,sp.z-a.z); g.add(pm); }
  }
  /* label */
  var lb=makeLabel("منطقة "+a.letter,a.type==="cold"?"#3fd0c4":"#f0a82a",1.1); lb.position.set(0,a.lev*LH+1.6,-a.d/2+.2); g.add(lb);
  /* cold enclosure */
  if(a.type==="cold"){
    var cm=new THREE.Mesh(new THREE.BoxGeometry(a.w+.6,a.lev*LH+.8,a.d+.4),new THREE.MeshBasicMaterial({color:0x3fd0c4,transparent:true,opacity:.07,depthWrite:false}));
    cm.position.set(0,(a.lev*LH+.8)/2,0); g.add(cm);
    var ce=new THREE.LineSegments(new THREE.EdgesGeometry(cm.geometry),new THREE.LineBasicMaterial({color:0x3fd0c4})); ce.position.copy(cm.position); g.add(ce);
    var fm=new THREE.Mesh(new THREE.PlaneGeometry(a.w+.6,a.d+.4),new THREE.MeshBasicMaterial({color:0x3fd0c4,transparent:true,opacity:.1})); fm.rotation.x=-Math.PI/2; fm.position.y=.02; g.add(fm);
  }

  var hit=new THREE.Mesh(new THREE.BoxGeometry(a.w,a.lev*LH+.4,a.d),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
